name: Generate contribution animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution graph animation
        uses: Platane/snk@v3
        with:
          github_user_name: MokuLakshithReddy
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23f0db4f
            dist/github-contribution-grid-snake.gif?color_snake=%23f0db4f&color_dots=%230d1117,%230e4429,%23006d32,%2326a641,%2339d353&color_background=%230d1117

      - name: Publish animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
