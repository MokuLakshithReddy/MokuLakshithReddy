<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #0d1117;
        --card-border: #30363d;
        --pill-bg: #161b22;
        --title-color: #e6edf3;
        --body-color: #8b949e;
        --link-color: #58a6ff;
        --divider-color: #21262d;
        --axis-color: #238636;
        --poly-fill: rgba(46, 160, 67, 0.42);
        --poly-stroke: #3fb950;
        --dot-fill: #0d1117;
      }
      .bg { fill: var(--card-bg); stroke: var(--card-border); stroke-width: 1; rx: 8px; }
      .pill { fill: var(--pill-bg); stroke: var(--card-border); stroke-width: 1; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: var(--title-color); }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--body-color); line-height: 1.6; }
      .link { fill: var(--link-color); font-weight: 500; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: var(--title-color); }
      .axis { stroke: var(--axis-color); stroke-width: 1.7; }
      .radar-poly { fill: var(--poly-fill); stroke: var(--poly-stroke); stroke-width: 1.5; }
      .radar-dot { fill: var(--dot-fill); stroke: var(--axis-color); stroke-width: 2; }
      .stat-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: var(--title-color); }
      .stat-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: var(--body-color); }
    </style>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="758" height="228" class="bg" />

  <!-- Org Pills -->
  <g transform="translate(20, 18)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="138" height="28" class="pill" />
    <circle cx="16" cy="14" r="5" fill="#58a6ff" />
    <text x="30" y="18" class="pill-text">@FlyAxis-Overseas</text>

    <!-- Pill 2 -->
    <rect x="146" y="0" width="108" height="28" class="pill" />
    <circle cx="162" cy="14" r="5" fill="#3fb950" />
    <text x="176" y="18" class="pill-text">@libreswan</text>

    <!-- Pill 3 -->
    <rect x="262" y="0" width="94" height="28" class="pill" />
    <circle cx="278" cy="14" r="5" fill="#f0883e" />
    <text x="292" y="18" class="pill-text">@apache</text>

    <!-- Pill 4 -->
    <rect x="364" y="0" width="108" height="28" class="pill" />
    <circle cx="380" cy="14" r="5" fill="#a371f7" />
    <text x="394" y="18" class="pill-text">@Open-VSX</text>
  </g>

  <!-- Left: Activity overview description -->
  <g transform="translate(20, 76)">
    <text x="0" y="0" class="title">Activity overview</text>

    <!-- Repo Icon -->
    <g transform="translate(0, 18)">
      <svg x="0" y="1" width="16" height="16" viewBox="0 0 16 16" fill="#8b949e">
        <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h6.5a.25.25 0 0 1 .25.25v1.5a.25.25 0 0 1-.25.25h-6.5a.25.25 0 0 1-.25-.25Z"></path>
      </svg>
      <text x="24" y="14" class="body-text">
        Contributed to <tspan class="link">MokuLakshithReddy/Secret_Leak_Detector</tspan>,
      </text>
      <text x="24" y="34" class="body-text">
        <tspan class="link">MokuLakshithReddy/thinkmate</tspan>, <tspan class="link">campus-connect</tspan>,
      </text>
      <text x="24" y="54" class="body-text">
        <tspan class="link">libreswan/libreswan.github.io</tspan> and 33 other repositories
      </text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="440" y1="65" x2="440" y2="205" stroke="var(--divider-color)" stroke-width="1" />

  <!-- Right: Radar Chart -->
  <g id="radar">
    <!-- Axes -->
    <line x1="590" y1="50" x2="590" y2="180" class="axis" />
    <line x1="525" y1="115" x2="655" y2="115" class="axis" />

    <!-- Polygon -->
    <polygon points="590,107 598,115 590,135.8 548.4,115" class="radar-poly" />

    <!-- Points -->
    <circle cx="590" cy="107" r="3.5" class="radar-dot" />
    <circle cx="598" cy="115" r="3.5" class="radar-dot" />
    <circle cx="590" cy="135.8" r="3.5" class="radar-dot" />
    <circle cx="548.4" cy="115" r="3.5" class="radar-dot" />

    <!-- Labels -->
    <!-- Top: Code review -->
    <text x="590" y="34" text-anchor="middle" class="stat-num">1%</text>
    <text x="590" y="46" text-anchor="middle" class="stat-label">Code review</text>

    <!-- Bottom: Pull requests -->
    <text x="590" y="195" text-anchor="middle" class="stat-num">32%</text>
    <text x="590" y="207" text-anchor="middle" class="stat-label">Pull requests</text>

    <!-- Left: Commits -->
    <text x="513" y="113" text-anchor="end" class="stat-num">64%</text>
    <text x="513" y="126" text-anchor="end" class="stat-label">Commits</text>

    <!-- Right: Issues -->
    <text x="667" y="113" text-anchor="start" class="stat-num">3%</text>
    <text x="667" y="126" text-anchor="start" class="stat-label">Issues</text>
  </g>
</svg>